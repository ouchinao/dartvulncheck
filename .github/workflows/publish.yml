# On a release tag, not on every push to main: what pub.dev receives is
# then exactly what the tag holds. No stored credential: the job presents
# a short-lived OpenID Connect token, which pub.dev accepts only from this
# repository and tag pattern (package admin page), so there is no secret
# here to leak.
name: Publish to pub.dev

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  # Compared here, not left to pub.dev: a tag pushed on a commit whose
  # pubspec names another version then fails with the reason, before
  # anything is uploaded.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: |
          version=$(sed -n 's/^version: *//p' pubspec.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "The tag is $GITHUB_REF_NAME, but pubspec.yaml says $version."
            exit 1
          fi
  publish:
    needs: check
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      # The pub.dev environment, not the default: pub.dev refuses a token
      # minted outside it, and the environment's own rules can limit which
      # tags reach it.
      environment: pub.dev
