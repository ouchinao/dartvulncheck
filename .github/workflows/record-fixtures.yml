# Run by hand, not on every push: the responses change only when advisories
# do, and each run spends API calls. It runs once on its own when this file
# changes, so a first recording needs no manual trigger.
name: Record API fixtures

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/record-fixtures.yml"]

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch the responses
        run: |
          set -euo pipefail
          mkdir -p fixtures
          record() {
            gh api "$2" > "fixtures/$1.json"
            echo "FIXTURE-COUNT $1 $(jq 'length' "fixtures/$1.json")"
            # One advisory per log line, not only the artifact: a log can be
            # read where an artifact cannot be downloaded.
            jq -c '.[]' "fixtures/$1.json" | awk -v n="$1" '{ print "FIXTURE " n " " $0 }'
          }
          # Named after the files under test/fixtures/responses/, not after
          # the endpoints, so that refreshing them is a copy.
          record github_repo_advisories_dart_sdk "/repos/dart-lang/sdk/security-advisories?state=published&per_page=100"
          record github_repo_advisories_flutter "/repos/flutter/flutter/security-advisories?state=published&per_page=100"
          record github_repo_advisories_cfug_dio "/repos/cfug/dio/security-advisories?state=published&per_page=100"
          record github_global_advisories "/advisories?ecosystem=pub&affects=dio@4.0.6,http@0.13.2&per_page=100"
      - uses: actions/upload-artifact@v4
        with:
          name: recorded-api-responses
          path: fixtures/
