# Records the GitHub API responses the tests use as fixtures. Run it by hand
# (Actions → "Record API fixtures" → Run workflow) to refresh them; it also
# runs once on its own when this file changes.
name: Record API fixtures

on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/record-fixtures.yml"]

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Fetch the responses
        run: |
          set -euo pipefail
          mkdir -p recorded
          record() {
            gh api "$2" > "recorded/$1.json"
            echo "FIXTURE-COUNT $1 $(jq 'length' "recorded/$1.json")"
            # One advisory per log line, so the log is a usable copy of the
            # artifact for anyone who cannot download it.
            jq -c '.[]' "recorded/$1.json" | awk -v n="$1" '{ print "FIXTURE " n " " $0 }'
          }
          record dart_sdk "/repos/dart-lang/sdk/security-advisories?state=published&per_page=100"
          record flutter "/repos/flutter/flutter/security-advisories?state=published&per_page=100"
          record cfug_dio "/repos/cfug/dio/security-advisories?state=published&per_page=100"
          record global "/advisories?ecosystem=pub&affects=dio@4.0.6,http@0.13.2&per_page=100"
      - uses: actions/upload-artifact@v4
        with:
          name: recorded-api-responses
          path: recorded/
